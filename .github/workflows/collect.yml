name: Mise à jour du catalogue
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les annonces eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python collect.py
      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if [ -f shopify_products.csv ]; then git add shopify_products.csv; fi
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if [ -d objet ]; then git add -A objet; fi
          if git diff --cached --quiet; then echo "Catalogue inchangé."; exit 0; fi
          git commit -m "Mise à jour du catalogue"
          git pull --rebase || { git rebase --abort; echo "Mise à jour concurrente : ignorée."; exit 0; }
          git push
